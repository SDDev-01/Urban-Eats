<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro Repartidor – Urban Eats</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/repartidor.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <!-- CHATBOT: estilos y meta CSRF -->
    <link rel="stylesheet" href="css/chatbot.css">

    <!-- NAVBAR -->
    <nav class="navbar">
    <a href="catalogo.html" class="navbar-logo">
        <img src="images/Logo.png" alt="Urban Eats">
        <span>Urban Eats</span>
    </a>
    <div class="navbar-links">
        <a href="restaurantes.html" class="navbar-link"><i class="fas fa-store"></i> Restaurantes</a>
    </div>
    <div class="navbar-right">
        <a href="perfil.html" class="navbar-usuario" style="text-decoration:none;">
        <i class="fas fa-user-circle"></i> <span id="navbar-nombre">Usuario</span>
        </a>
        <a href="carrito.html" class="btn-carrito" aria-label="Ver carrito">
        <i class="fas fa-shopping-cart"></i>
        <span class="carrito-badge" id="carrito-badge">0</span>
        </a>
    </div>
    </nav>

    <!-- CHATBOT SCRIPTS (cargados una sola vez) -->
        <script src="js/chatbot.js" defer></script>

<div class="pagina-form">
  <div class="form-wrapper">

    <div class="form-page-header">
      <h2><i class="fas fa-motorcycle"></i> Registro de Repartidor</h2>
      <!-- TEMPORAL: Laravel mostraba aquí session('Nombres') con el nombre real del usuario autenticado -->
      <p>Hola, <strong>Usuario</strong>. Ingresa los datos de tu vehículo para comenzar a repartir.</p>
    </div>

    <div class="form-card">
      <div class="form-card-body">

        <!-- TEMPORAL:
             Laravel enviaba este formulario por POST al backend para
             registrar al repartidor (incluía @csrf, old() y los mensajes
             de $errors provenientes de la validación del servidor).

             Cuando implementemos Java/Python, este formulario deberá
             conectarse nuevamente con el backend mediante JavaScript/API.
        -->
        <form id="form-repartidor">

          <div class="seccion-sep">
            <i class="fas fa-motorcycle"></i> Datos del Vehículo
          </div>

          <div class="form-grid">
            <div class="campo">
              <label for="rp-vehiculo">Tipo de vehículo <span style="color:red">*</span></label>
              <select id="rp-vehiculo" name="TipoVehiculo">
                <option value="">Seleccionar...</option>
                <option value="Moto">Moto</option>
                <option value="Bicicleta">Bicicleta</option>
                <option value="Bici">Bici</option>
                <option value="Carro">Carro</option>
              </select>
              <span class="error"></span>
            </div>
            <div class="campo">
              <label for="rp-placa">Placa <span style="color:red">*</span></label>
              <input type="text" id="rp-placa" name="Placa"
                     placeholder="ABC-123"
                     style="text-transform:uppercase;">
              <span class="error"></span>
            </div>
          </div>

          <div class="campo">
            <label for="rp-soat">SOAT (número de póliza)</label>
            <div class="campo-icono">
              <i class="fas fa-file-alt"></i>
              <input type="text" id="rp-soat" name="SOAT"
                     placeholder="SOA-987654">
            </div>
            <span class="error"></span>
          </div>

          <div class="campo">
            <label for="rp-seguro">Seguro del vehículo</label>
            <div class="campo-icono">
              <i class="fas fa-shield-alt"></i>
              <input type="text" id="rp-seguro" name="SeguroVehiculo"
                     placeholder="Aseguradora / N° póliza">
            </div>
            <span class="error"></span>
          </div>

          <div class="form-btn-wrap" style="margin-top:1.5rem;">
            <a href="catalogo.html" class="btn btn-gris">
              <i class="fas fa-arrow-left"></i> Cancelar
            </a>
            <button type="submit" class="btn btn-verde btn-grande">
              <i class="fas fa-check-circle"></i> Registrarme
            </button>
          </div>

        </form>

      </div>
    </div>

  </div>
</div>

<footer><p>&copy; 2026 Urban Eats – Proyecto Formativo SENA</p></footer>
<div id="toast-container"></div>
<script src="js/app.js"></script>
<script src="js/repartidor.js"></script>
</body>
</html>
