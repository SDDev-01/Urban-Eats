<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Registro Repartidor – Urban Eats</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" th:content="${_csrf.token}">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/repartidor.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <!-- CHATBOT: estilos y meta CSRF -->
    <link rel="stylesheet" href="/css/chatbot.css">

    <!-- NAVBAR -->
    <nav class="navbar">
    <a href="/catalogo" class="navbar-logo">
        <img src="/images/Logo.png" alt="Urban Eats">
        <span>Urban Eats</span>
    </a>
    <div class="navbar-links">
        <a href="/restaurantes" class="navbar-link"><i class="fas fa-store"></i> Restaurantes</a>
    </div>
    <div class="navbar-right">
        <a href="/perfil" class="navbar-usuario" style="text-decoration:none;">
        <i class="fas fa-user-circle"></i> <span id="navbar-nombre" th:text="${#authentication.principal instanceof T(com.urbaneats.security.CustomUserDetails)} ? ${#authentication.principal.nombres} : 'Usuario'">Usuario</span>
        </a>
        <a href="/carrito" class="btn-carrito" aria-label="Ver carrito">
        <i class="fas fa-shopping-cart"></i>
        <span class="carrito-badge" id="carrito-badge">0</span>
        </a>
    </div>
    </nav>

    <!-- CHATBOT SCRIPTS (cargados una sola vez) -->
        <script src="/js/chatbot.js" defer></script>

<div class="pagina-form">
  <div class="form-wrapper">

    <div class="form-page-header">
      <h2><i class="fas fa-motorcycle"></i> Registro de Repartidor</h2>
      <p>Hola, <strong th:text="${nombreUsuario}">Usuario</strong>. Ingresa los datos de tu vehículo para comenzar a repartir.</p>
    </div>

    <div th:if="${error != null}" class="msg-verificacion msg-error" style="margin-bottom:1.2rem;">
      <i class="fas fa-exclamation-triangle"></i> <span th:text="${error}">Error</span>
    </div>

    <div class="form-card">
      <div class="form-card-body">

        <form id="form-repartidor" th:action="@{/repartidor}" method="POST">

          <div class="seccion-sep">
            <i class="fas fa-motorcycle"></i> Datos del Vehículo
          </div>

          <div class="form-grid">
            <div class="campo">
              <label for="rp-vehiculo">Tipo de vehículo <span style="color:red">*</span></label>
              <select id="rp-vehiculo" name="tipoVehiculo">
                <option value="">Seleccionar...</option>
                <option value="Moto">Moto</option>
                <option value="Bicicleta">Bicicleta</option>
                <option value="Bici">Bici</option>
                <option value="Carro">Carro</option>
              </select>
              <span class="error"></span>
            </div>
            <div class="campo">
              <label for="rp-placa">Placa <span style="color:red">*</span></label>
              <input type="text" id="rp-placa" name="placa"
                     placeholder="ABC-123"
                     style="text-transform:uppercase;">
              <span class="error"></span>
            </div>
          </div>

          <div class="campo">
            <label for="rp-soat">SOAT (número de póliza)</label>
            <div class="campo-icono">
              <i class="fas fa-file-alt"></i>
              <input type="text" id="rp-soat" name="soat"
                     placeholder="SOA-987654">
            </div>
            <span class="error"></span>
          </div>

          <div class="campo">
            <label for="rp-seguro">Seguro del vehículo</label>
            <div class="campo-icono">
              <i class="fas fa-shield-alt"></i>
              <input type="text" id="rp-seguro" name="seguroVehiculo"
                     placeholder="Aseguradora / N° póliza">
            </div>
            <span class="error"></span>
          </div>

          <div class="form-btn-wrap" style="margin-top:1.5rem;">
            <a href="/catalogo" class="btn btn-gris">
              <i class="fas fa-arrow-left"></i> Cancelar
            </a>
            <button type="submit" class="btn btn-verde btn-grande">
              <i class="fas fa-check-circle"></i> Registrarme
            </button>
          </div>

        </form>

      </div>
    </div>

  </div>
</div>

<footer><p>&copy; 2026 Urban Eats – Proyecto Formativo SENA</p></footer>
<div id="toast-container"></div>
<script src="/js/app.js"></script>
<script src="/js/repartidor.js"></script>
</body>
</html>
