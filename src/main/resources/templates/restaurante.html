<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Crear Restaurante – Urban Eats</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/restaurante.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <!-- CHATBOT: estilos y meta CSRF -->
    <link rel="stylesheet" href="css/chatbot.css">

    <!-- NAVBAR -->
    <nav class="navbar">
    <a href="catalogo.html" class="navbar-logo">
        <img src="images/Logo.png" alt="Urban Eats">
        <span>Urban Eats</span>
    </a>
    <div class="navbar-links">
        <a href="restaurantes.html" class="navbar-link"><i class="fas fa-store"></i> Restaurantes</a>
    </div>
    <div class="navbar-right">
        <a href="perfil.html" class="navbar-usuario" style="text-decoration:none;">
        <i class="fas fa-user-circle"></i> <span id="navbar-nombre">Usuario</span>
        </a>
        <a href="carrito.html" class="btn-carrito" aria-label="Ver carrito">
        <i class="fas fa-shopping-cart"></i>
        <span class="carrito-badge" id="carrito-badge">0</span>
        </a>
    </div>
    </nav>

    <!-- CHATBOT SCRIPTS (cargados una sola vez) -->
        <script src="js/chatbot.js" defer></script>

  <div class="pagina-form">
    <div class="form-wrapper">

      <div class="form-page-header">
        <h2><i class="fas fa-store"></i> Crear Restaurante</h2>
        <p>Ingresa la información de tu restaurante para registrarlo en Urban Eats.</p>
      </div>

      <div class="form-card">
        <div class="form-card-body">

          <!-- TEMPORAL:
               Laravel enviaba este formulario por POST al backend para crear
               un nuevo restaurante (incluía @csrf y old() para conservar
               los valores ingresados si la validación fallaba).

               Cuando implementemos Java/Python, este formulario deberá
               conectarse nuevamente con el backend mediante JavaScript/API.
          -->
          <form id="form-restaurante">

            <div class="campo">
              <label for="r-nombre">Nombre del restaurante</label>
              <input type="text" id="r-nombre" name="Nombre"
                     placeholder="Ej: Green Kitchen">
              <span class="error" id="err-r-nombre"></span>
            </div>

            <div class="campo">
              <label for="r-direccion">Dirección</label>
              <div class="campo-icono">
                <i class="fas fa-map-marker-alt"></i>
                <input type="text" id="r-direccion" name="Direccion"
                       placeholder="Calle 72 # 5-80, Bogotá">
              </div>
              <span class="error" id="err-r-dir"></span>
            </div>

            <div class="campo">
              <label for="r-horario">Horario de atención</label>
              <div class="campo-icono">
                <i class="fas fa-clock"></i>
                <input type="text" id="r-horario" name="Horario"
                       placeholder="Ej: 12:00 AM – 5:00 AM">
              </div>
              <span class="error" id="err-r-horario"></span>
            </div>

            <!-- Mensaje de verificación del lado del cliente -->
            <div id="msg-verificacion" class="msg-verificacion" style="display:none;"></div>

            <div class="form-btn-wrap">
              <button type="button" class="btn btn-verde btn-grande" id="btn-verificar">
                <i class="fas fa-check-circle"></i> Crear Restaurante
              </button>
            </div>

          </form>

        </div>
      </div>

    </div>
  </div>

  <footer><p>&copy; 2026 Urban Eats – Proyecto Formativo SENA</p></footer>
  <div id="toast-container"></div>
  <script src="js/app.js"></script>
  <script src="js/restaurante.js"></script>
</body>
</html>
