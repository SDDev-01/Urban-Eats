<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Restaurante – Urban Eats</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/restaurante-detalle.css">
</head>
<body>

  <!-- NAVBAR -->
    <!-- CHATBOT: estilos y meta CSRF -->
    <link rel="stylesheet" href="css/chatbot.css">

    <!-- NAVBAR -->
    <nav class="navbar">
    <a href="catalogo.html" class="navbar-logo">
        <img src="images/Logo.png" alt="Urban Eats">
        <span>Urban Eats</span>
    </a>
    <div class="navbar-links">
        <a href="restaurantes.html" class="navbar-link"><i class="fas fa-store"></i> Restaurantes</a>
    </div>
    <div class="navbar-right">
        <a href="perfil.html" class="navbar-usuario" style="text-decoration:none;">
        <i class="fas fa-user-circle"></i> <span id="navbar-nombre">Usuario</span>
        </a>
        <a href="carrito.html" class="btn-carrito" aria-label="Ver carrito">
        <i class="fas fa-shopping-cart"></i>
        <span class="carrito-badge" id="carrito-badge">0</span>
        </a>
    </div>
    </nav>

    <!-- CHATBOT SCRIPTS (cargados una sola vez) -->
        <script src="js/chatbot.js" defer></script>

  <div style="padding-top: var(--navbar-height);">
    <!-- HEADER DEL RESTAURANTE -->
    <div class="restaurante-hero" id="restaurante-hero"
         th:attr="data-id=${restaurante.codigoRestaurante}">
      <div class="restaurante-logo-grande" style="background: rgba(255,255,255,0.25);">🍽️</div>
      <div class="restaurante-info-hero">
        <h1 th:text="${restaurante.nombre}">Nombre del restaurante</h1>
        <div class="restaurante-detalles">
          <div class="restaurante-detalle-item">
            <i class="fas fa-map-marker-alt"></i>
            <span th:text="${restaurante.direccion} ?: '—'">Dirección</span>
          </div>
          <div class="restaurante-detalle-item">
            <i class="fas fa-clock"></i>
            <span th:text="${restaurante.horario} ?: '—'">Horario</span>
          </div>
        </div>
      </div>
    </div>

    <!-- BOTÓN VOLVER -->
    <div class="volver-section">
      <a th:href="@{/restaurantes}" href="restaurantes.html" class="btn-volver">
        <i class="fas fa-arrow-left"></i> Volver a Restaurantes
      </a>
    </div>

    <!-- FILTROS DE CATEGORÍAS (generados en el servidor) -->
    <div class="filtros-wrap">
      <button class="btn-filtro activo" data-categoria="todos">Todos</button>
      <button class="btn-filtro"
              th:each="categoria : ${categorias}"
              th:attr="data-categoria=${categoria}"
              th:text="${categoria}">Categoría</button>
    </div>

    <!-- GRID DE PRODUCTOS (renderizado por Thymeleaf) -->
    <div class="productos-grid" id="productos-grid">

      <p th:if="${#lists.isEmpty(platos)}"
         style="text-align:center;color:var(--texto-gris);padding:3rem;grid-column:1/-1;">
        No hay productos disponibles.
      </p>

      <div class="producto-card"
           th:each="plato : ${platos}"
           th:attr="data-categoria=${plato.menu != null ? plato.menu.categoria : ''}">
        <div class="producto-img-wrap">
          <span class="producto-emoji"
                style="display:flex; font-size:3rem; align-items:center; justify-content:center; height:100%;">🍽️</span>
        </div>
        <div class="producto-body">
          <div class="producto-categoria"
               th:text="${plato.menu != null ? plato.menu.categoria : '—'}">Categoría</div>
          <div class="producto-nombre" th:text="${plato.nombre}">Nombre del plato</div>
          <div class="producto-desc" th:text="${plato.descripcion}">Descripción</div>
          <div class="producto-footer">
            <span class="producto-precio"
                  th:text="'$' + ${#numbers.formatInteger(plato.precio, 0, 'POINT')} + ' COP'">$0 COP</span>
            <button class="btn-ver"
                    th:attr="data-id=${plato.codigoPlato},
                             data-nombre=${plato.nombre},
                             data-descripcion=${plato.descripcion},
                             data-precio=${plato.precio},
                             data-categoria=${plato.menu != null ? plato.menu.categoria : ''}">
              Ver detalles
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- MODAL DETALLE PRODUCTO -->
  <div class="modal-overlay" id="modal-detalle">
    <div class="modal" style="max-width: 660px;">
      <div class="modal-header">
        <h3 id="modal-titulo">Detalle del producto</h3>
        <button class="modal-cerrar" id="modal-cerrar-btn"><i class="fas fa-times"></i></button>
      </div>
      <div class="detalle-grid">
        <div id="modal-imagen-wrap"></div>
        <div class="detalle-info">
          <span class="categoria-tag" id="modal-categoria"></span>
          <h2 id="modal-nombre"></h2>
          <p id="modal-descripcion"></p>
          <div class="detalle-stats" id="modal-stats"></div>
          <div class="cantidad-control">
            <label>Cantidad</label>
            <button class="btn-cantidad" id="btn-menos"><i class="fas fa-minus"></i></button>
            <span id="detalle-cantidad">1</span>
            <button class="btn-cantidad" id="btn-mas"><i class="fas fa-plus"></i></button>
          </div>
          <div class="detalle-precio" id="modal-precio"></div>
          <button class="btn btn-verde btn-grande" id="btn-agregar-carrito">
            <i class="fas fa-shopping-cart"></i> Agregar al Carrito
          </button>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 Urban Eats – Proyecto Formativo SENA. Comida saludable para todos.</p>
  </footer>

  <div id="toast-container"></div>
  
  <script src="js/app.js"></script>
  <!-- El restaurante y sus platos ya vienen renderizados por Thymeleaf desde
       RestauranteDetalleController. restaurante-detalle.js solo se encarga de
       los filtros, el modal y el carrito. -->
  <script src="js/restaurante-detalle.js"></script>
</body>
</html>
