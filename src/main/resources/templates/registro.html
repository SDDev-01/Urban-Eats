<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Registro – Urban Eats</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/registro.css}">
</head>
<body>

  <div class="registro-card">
    <div class="registro-header">
      <div class="registro-logo"><img th:src="@{/images/Logo.png}" alt="Urban Eats"></div>
      <h1>Crear Cuenta</h1>
      <p>Únete a Urban Eats y disfruta comida saludable</p>
    </div>

    <div th:if="${error != null}" class="login-error-msg" style="margin-bottom:1rem;">
      <i class="fas fa-exclamation-circle"></i> <span th:text="${error}">Error</span>
    </div>

    <form id="form-registro" th:action="@{/registro}" method="post">
      <div class="form-grid">
        <div class="campo">
          <label for="reg-nombres">Nombres</label>
          <input type="text" id="reg-nombres" name="Nombres" placeholder="Juan" required>
          <span class="error" id="error-nombres"></span>
        </div>
        <div class="campo">
          <label for="reg-apellidos">Apellidos</label>
          <input type="text" id="reg-apellidos" name="Apellidos" placeholder="Pérez" required>
          <span class="error" id="error-apellidos"></span>
        </div>
      </div>

      <div class="campo">
        <label for="reg-email">Correo electrónico</label>
        <div class="campo-icono">
          <i class="fas fa-envelope"></i>
          <input type="email" id="reg-email" name="Correo" placeholder="tu@email.com" required>
        </div>
        <span class="error" id="error-email"></span>
      </div>

      <div class="form-grid">
        <div class="campo">
          <label for="reg-telefono">Teléfono</label>
          <div class="campo-icono">
            <i class="fas fa-phone"></i>
            <input type="tel" id="reg-telefono" name="Telefono" placeholder="300 123 4567" maxlength="10" pattern="[0-9]*" inputmode="numeric" required>
          </div>
          <span class="error" id="error-telefono"></span>
        </div>
        <div class="campo">
          <label for="reg-password">Contraseña</label>
          <div class="campo-icono">
            <i class="fas fa-lock"></i>
            <input type="password" id="reg-password" name="Password" placeholder="Mínimo 8 caracteres" minlength="8" required>
          </div>
          <span class="error" id="error-password"></span>
        </div>
      </div>

      <div class="campo">
        <label for="reg-direccion">Dirección de entrega</label>
        <div class="campo-icono">
          <i class="fas fa-map-marker-alt"></i>
          <input type="text" id="reg-direccion" name="Direccion" placeholder="Calle 45 # 12-30, Bogotá" required>
        </div>
        <span class="error" id="error-direccion"></span>
      </div>

      <button type="submit" class="btn-registro">
        <i class="fas fa-user-check"></i> Crear Cuenta
      </button>

      <div class="reg-footer">
        ¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a>
      </div>
    </form>
  </div>

  <div id="toast-container"></div>
  <script th:src="@{/js/app.js}"></script>
</body>
</html>
