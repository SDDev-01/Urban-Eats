<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Navbar sencilla para las paginas nuevas de la fase 6 -->
<nav th:fragment="navbar" class="navbar">
  <a href="/catalogo" class="navbar-logo">
    <img src="/images/Logo.png" alt="Urban Eats">
    <span>Urban Eats</span>
  </a>
  <div class="navbar-links">
    <a href="/restaurantes" class="navbar-link"><i class="fas fa-store"></i> Restaurantes</a>
    <a href="/mis-pedidos" class="navbar-link"><i class="fas fa-receipt"></i> Mis pedidos</a>
  </div>
  <div class="navbar-right">
    <a href="/perfil" class="navbar-usuario" style="text-decoration:none;">
      <i class="fas fa-user-circle"></i>
      <span th:text="${#authentication.principal instanceof T(com.urbaneats.security.CustomUserDetails)} ? ${#authentication.principal.nombres} : 'Usuario'">Usuario</span>
    </a>
  </div>
</nav>

<!-- Franja de modo demostracion (solo si MODO_DEMO=true en el .env) -->
<div th:fragment="franjaDemo" th:if="${modoDemo}" class="franja-demo">
  <i class="fas fa-flask"></i> Entorno de demostración – datos y pagos de prueba
</div>

<!-- Mensajes flash -->
<div th:fragment="mensajes">
  <div th:if="${exito != null}" class="sol-alerta exito"><i class="fas fa-check-circle"></i> <span th:text="${exito}"></span></div>
  <div th:if="${error != null}" class="sol-alerta error"><i class="fas fa-triangle-exclamation"></i> <span th:text="${error}"></span></div>
</div>

</body>
</html>
