<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Pago – Urban Eats</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" th:content="${_csrf.token}">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/pago.css">
</head>
<body>

    <!-- CHATBOT: estilos y meta CSRF -->
    <link rel="stylesheet" href="/css/chatbot.css">

    <!-- NAVBAR -->
    <nav class="navbar">
    <a href="/catalogo" class="navbar-logo">
        <img src="/images/Logo.png" alt="Urban Eats">
        <span>Urban Eats</span>
    </a>
    <div class="navbar-links">
        <a href="/restaurantes" class="navbar-link"><i class="fas fa-store"></i> Restaurantes</a>
    </div>
    <div class="navbar-right">
        <a href="/perfil" class="navbar-usuario" style="text-decoration:none;">
        <i class="fas fa-user-circle"></i> <span id="navbar-nombre" th:text="${#authentication.principal instanceof T(com.urbaneats.security.CustomUserDetails)} ? ${#authentication.principal.nombres} : 'Usuario'">Usuario</span>
        </a>
        <a href="/carrito" class="btn-carrito" aria-label="Ver carrito">
        <i class="fas fa-shopping-cart"></i>
        <span class="carrito-badge" id="carrito-badge">0</span>
        </a>
    </div>
    </nav>

    <!-- CHATBOT SCRIPTS (cargados una sola vez) -->
        <script src="/js/chatbot.js" defer></script>



  <div class="pagina">
    <div style="max-width:1000px; margin:0 auto; padding:0 2rem 1rem;">
      <h2 class="seccion-titulo"><i class="fas fa-credit-card" style="color:var(--verde);"></i> Método de Pago</h2>
      <p class="seccion-subtitulo">Elige cómo quieres pagar tu pedido</p>
    </div>

    <div class="pago-layout">
    <!-- Mercado Pago: la Public Key viene del modelo (mercadopago.public-key en application.properties) -->
    <script th:inline="javascript">
        window.MP_PUBLIC_KEY = /*[[${mpPublicKey}]]*/ "";
    </script>
      <!-- Columna izquierda: mercado pago -->
      <script src="https://sdk.mercadopago.com/js/v2"></script>
      <!--contenedor del brick-->
      <div id="paymentBrick_container">
        
      </div>

      <!-- Resumen lateral -->
      <div class="resumen-pago">
        <h3>Resumen del Pedido</h3>
        <div id="resumen-items-pago">
          <p style="color:var(--texto-gris); font-size:0.875rem;">No hay pedido activo.</p>
        </div>
        <hr class="resumen-separador">
        <div class="resumen-linea"><span class="label">Subtotal</span><span id="pago-subtotal">$0</span></div>
        <hr class="resumen-separador">
        <div class="resumen-total-pago">
          <span>Total</span>
          <!--monto pago-->
          <span class="monto" id="pago-total">$0 COP</span>
          <input type="hidden" id="monto-input" name="monto" value="0">
        </div>
        <!-- boton viejo de pago
        <button class="btn-pagar" id="btn-pagar">
          <i class="fas fa-lock"></i> Confirmar Pago
        </button>
        <div class="seguridad-nota">
          <i class="fas fa-shield-alt" style="color:var(--verde);"></i>
          Pago 100% seguro y encriptado
        </div>
        -->
      </div>
    </div>
  </div>

  <footer><p>&copy; 2026 Urban Eats – Proyecto Formativo SENA</p></footer>
  <div id="toast-container"></div>
  <script src="/js/app.js"></script>
  <script src="/js/pago.js"></script>
</body>
</html>
