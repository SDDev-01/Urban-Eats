spring.application.name=urban-eats

# Base de datos: los valores salen del .env. Lo que va despues de ":" es el valor por
# defecto, pensado para XAMPP local (usuario root sin contrasena), asi la aplicacion
# arranca aunque falte alguna variable.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/urbaneats?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
# Respeta los nombres de @Table y @Column tal como estan escritos.
# Sin esto Spring Boot convierte CodigoRestaurante en codigo_restaurante
# y ninguna consulta encuentra sus columnas, porque la BD usa PascalCase.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

# MercadoPago: credenciales de PRUEBA (vacias = pasarela no configurada)
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
mercadopago.public-key=${MERCADOPAGO_PUBLIC_KEY:}

# Servicio Python (FastAPI): verificacion de cocinas, reportes, chatbot y rutas
urbaneats.python.url=${PYTHON_SERVICE_URL:http://localhost:8000}
urbaneats.python.api-key=${PYTHON_API_KEY:}

# Modo demostracion para la sustentacion: franja visible en todas las paginas y
# se permite pedir fuera del horario de las cocinas.
urbaneats.modo-demo=${MODO_DEMO:false}
# Pagos simulados (sin MercadoPago). Nunca dejar en true en un despliegue real.
urbaneats.pagos.modo-demo=${PAGOS_MODO_DEMO:false}

# Reglas del negocio
urbaneats.pedido.monto-minimo=10000

# Archivos subidos (documentos de las cocinas): maximo 5 MB por archivo
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=30MB
