spring.application.name=urban-eats

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
# Respeta los nombres de @Table y @Column tal como estan escritos.
# Sin esto Spring Boot convierte CodigoRestaurante en codigo_restaurante
# y ninguna consulta encuentra sus columnas, porque la BD usa PascalCase.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
